<div id="geo-lookup-widget">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Share+Tech+Mono&display=swap');

  #geo-lookup-widget {
    --bg:       #0a0a0a;
    --surface:  #111111;
    --border:   #2a2a2a;
    --red:      #e8001c;
    --red-dim:  #7a0010;
    --white:    #f0f0f0;
    --muted:    #555555;
    --muted2:   #333333;
    --f-display: 'Black Han Sans', sans-serif;
    --f-mono:    'Share Tech Mono', monospace;
  }

  #geo-lookup-widget *, #geo-lookup-widget *::before, #geo-lookup-widget *::after {
    box-sizing: border-box; margin: 0; padding: 0;
  }

  #geo-lookup-widget .glw-wrap {
    background: var(--bg);
    border: 2px solid var(--border);
    border-top: 4px solid var(--red);
    max-width: 580px;
    margin: 0 auto;
    padding: 0;
    position: relative;
    overflow: hidden;
    font-family: var(--f-mono);
    color: var(--white);
  }

  /* Scan line overlay */
  #geo-lookup-widget .glw-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.013) 2px,
      rgba(255,255,255,0.013) 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  /* Animated red sweep line */
  #geo-lookup-widget .glw-wrap::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    opacity: 0.5;
    animation: glwSweep 4s ease-in-out infinite;
    z-index: 11;
    pointer-events: none;
  }

  /* ── Header bar ── */
  #geo-lookup-widget .glw-header {
    background: var(--surface);
    border-bottom: 2px solid var(--red);
    padding: 22px 32px 20px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  #geo-lookup-widget .glw-sys-line {
    font-family: var(--f-mono);
    font-size: 10px;
    color: var(--red);
    letter-spacing: .18em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  #geo-lookup-widget .glw-title {
    font-family: var(--f-display);
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    letter-spacing: .05em;
    line-height: 1;
    color: var(--white);
    text-transform: uppercase;
  }

  #geo-lookup-widget .glw-title-accent {
    color: var(--red);
    display: inline;
  }

  #geo-lookup-widget .glw-subtitle {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* corner decoration */
  #geo-lookup-widget .glw-corner {
    position: absolute;
    bottom: -2px; right: 28px;
    width: 60px; height: 3px;
    background: var(--red);
  }

  /* ── Body ── */
  #geo-lookup-widget .glw-body {
    padding: 28px 32px 36px;
  }

  /* ── Input section ── */
  #geo-lookup-widget .glw-input-label {
    font-family: var(--f-mono);
    font-size: 10px;
    color: var(--red);
    letter-spacing: .2em;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #geo-lookup-widget .glw-input-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--muted2);
  }

  #geo-lookup-widget .glw-field {
    display: flex;
    gap: 0;
    margin-bottom: 28px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    transition: border-color .2s;
  }
  #geo-lookup-widget .glw-field:focus-within {
    border-color: var(--red);
    box-shadow: 0 0 0 1px var(--red-dim);
  }

  #geo-lookup-widget .glw-input {
    flex: 1;
    height: 52px;
    background: transparent;
    border: none;
    padding: 0 18px;
    font-family: var(--f-mono);
    font-size: 15px;
    color: var(--white);
    outline: none;
    -webkit-appearance: none;
    caret-color: var(--red);
    letter-spacing: .04em;
  }
  #geo-lookup-widget .glw-input::placeholder {
    color: var(--muted);
    font-size: 13px;
  }

  #geo-lookup-widget .glw-btn {
    height: 52px;
    width: 120px;
    background: var(--red);
    color: var(--white);
    border: none;
    border-left: 2px solid var(--red-dim);
    font-family: var(--f-display);
    font-size: 14px;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: background .18s;
    -webkit-appearance: none;
    flex-shrink: 0;
  }
  #geo-lookup-widget .glw-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    transition: left .35s;
  }
  #geo-lookup-widget .glw-btn:hover { background: #ff0020; }
  #geo-lookup-widget .glw-btn:hover::before { left: 150%; }
  #geo-lookup-widget .glw-btn:active { background: var(--red-dim); }
  #geo-lookup-widget .glw-btn:disabled {
    background: var(--muted2);
    color: var(--muted);
    cursor: not-allowed;
    border-left-color: var(--border);
  }
  #geo-lookup-widget .glw-btn:disabled::before { display: none; }

  /* ── Divider ── */
  #geo-lookup-widget .glw-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }
  #geo-lookup-widget .glw-divider::before,
  #geo-lookup-widget .glw-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--muted2);
  }
  #geo-lookup-widget .glw-divider-label {
    font-family: var(--f-mono);
    font-size: 9px;
    color: var(--muted);
    letter-spacing: .18em;
    text-transform: uppercase;
  }

  /* ── Result area ── */
  #geo-lookup-widget .glw-result { min-height: 80px; }

  /* Loading */
  #geo-lookup-widget .glw-loading {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: var(--f-mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  #geo-lookup-widget .glw-bar-wrap {
    width: 80px;
    height: 3px;
    background: var(--muted2);
    overflow: hidden;
  }
  #geo-lookup-widget .glw-bar-inner {
    height: 100%;
    background: var(--red);
    animation: glwBar 1.4s ease-in-out infinite;
  }

  /* Result card */
  #geo-lookup-widget .glw-card {
    border-left: 3px solid var(--muted2);
    padding: 18px 20px;
    background: var(--surface);
    animation: glwReveal .3s ease both;
    position: relative;
  }
  #geo-lookup-widget .glw-card.city    { border-left-color: #00bfff; }
  #geo-lookup-widget .glw-card.country { border-left-color: var(--red); }
  #geo-lookup-widget .glw-card.err     { border-left-color: var(--muted); }

  #geo-lookup-widget .glw-card-sys {
    font-family: var(--f-mono);
    font-size: 9.5px;
    letter-spacing: .2em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  #geo-lookup-widget .glw-card.city    .glw-card-sys { color: #00bfff; }
  #geo-lookup-widget .glw-card.country .glw-card-sys { color: var(--red); }
  #geo-lookup-widget .glw-card.err     .glw-card-sys { color: var(--muted); }

  #geo-lookup-widget .glw-query-name {
    font-family: var(--f-display);
    font-size: clamp(1.3rem, 4vw, 1.8rem);
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--white);
    line-height: 1.1;
    margin-bottom: 8px;
  }

  #geo-lookup-widget .glw-answer-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  #geo-lookup-widget .glw-answer-key {
    font-family: var(--f-mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .15em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #geo-lookup-widget .glw-answer-val {
    font-family: var(--f-mono);
    font-size: 16px;
    color: var(--white);
    font-weight: bold;
    letter-spacing: .06em;
  }
  #geo-lookup-widget .glw-card.city .glw-answer-val    { color: #00bfff; }
  #geo-lookup-widget .glw-card.country .glw-answer-val { color: var(--red); }

  /* ── History ── */
  #geo-lookup-widget .glw-history {
    margin-top: 20px;
    border-top: 1px solid var(--muted2);
    padding-top: 16px;
  }
  #geo-lookup-widget .glw-hist-label {
    font-family: var(--f-mono);
    font-size: 9px;
    color: var(--muted);
    letter-spacing: .2em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  #geo-lookup-widget .glw-hist-rows {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  #geo-lookup-widget .glw-hist-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--f-mono);
    font-size: 12px;
    color: var(--muted);
    padding: 8px 12px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all .15s;
    animation: glwReveal .2s ease both;
    background: transparent;
  }
  #geo-lookup-widget .glw-hist-row:hover {
    background: var(--surface);
    border-left-color: var(--red);
    color: var(--white);
  }
  #geo-lookup-widget .glw-hist-q { font-weight: bold; text-transform: uppercase; letter-spacing: .06em; }
  #geo-lookup-widget .glw-hist-a { text-align: right; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }

  /* ── Status bar ── */
  #geo-lookup-widget .glw-statusbar {
    background: var(--surface);
    border-top: 1px solid var(--muted2);
    padding: 7px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #geo-lookup-widget .glw-status-left,
  #geo-lookup-widget .glw-status-right {
    font-family: var(--f-mono);
    font-size: 9px;
    color: var(--muted);
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  #geo-lookup-widget .glw-status-dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--red);
    margin-right: 6px;
    animation: glwBlink 2s ease-in-out infinite;
    vertical-align: middle;
  }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    #geo-lookup-widget .glw-header,
    #geo-lookup-widget .glw-body { padding-left: 20px; padding-right: 20px; }
    #geo-lookup-widget .glw-statusbar { padding-left: 20px; padding-right: 20px; }
    #geo-lookup-widget .glw-field { flex-direction: column; border: none; gap: 0; }
    #geo-lookup-widget .glw-input {
      height: 48px;
      border: 1.5px solid var(--border);
      padding: 0 14px;
    }
    #geo-lookup-widget .glw-field:focus-within .glw-input { border-color: var(--red); }
    #geo-lookup-widget .glw-btn { height: 44px; width: 100%; border-left: none; border-top: 2px solid var(--red-dim); }
    #geo-lookup-widget .glw-title { font-size: 1.5rem; }
  }

  /* ── Keyframes ── */
  @keyframes glwSweep {
    0%   { top: -2px; opacity: 0; }
    10%  { opacity: 0.5; }
    90%  { opacity: 0.5; }
    100% { top: 100%; opacity: 0; }
  }
  @keyframes glwBar {
    0%   { width: 0%; margin-left: 0; }
    50%  { width: 100%; margin-left: 0; }
    100% { width: 0%; margin-left: 100%; }
  }
  @keyframes glwReveal {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes glwBlink {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.2; }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

<div class="glw-wrap">

  <!-- Header -->
  <div class="glw-header">
    <div class="glw-sys-line">SYS // GEO-LOOKUP v3.0 // ACTIVE</div>
    <div class="glw-title">Справочник<br><span class="glw-title-accent">Захара</span></div>
    <div class="glw-subtitle">// ГОРОДА И СТРАНЫ МИРА //</div>
    <div class="glw-corner"></div>
  </div>

  <!-- Body -->
  <div class="glw-body">

    <div class="glw-input-label">Запрос</div>
    <div class="glw-field">
      <input id="glwInput" class="glw-input"
             type="text"
             placeholder="Введите город или страну..."
             autocomplete="off" spellcheck="false" />
      <button id="glwBtn" class="glw-btn" onclick="glwSearch()">Найти</button>
    </div>

    <div class="glw-divider">
      <span class="glw-divider-label">Output</span>
    </div>

    <div class="glw-result" id="glwResult">
      <div class="glw-loading" style="opacity:.3">
        <div class="glw-bar-wrap"><div class="glw-bar-inner"></div></div>
        <span>Ожидание запроса</span>
      </div>
    </div>

    <div id="glwHistory"></div>

  </div>

  <!-- Status bar -->
  <div class="glw-statusbar">
    <div class="glw-status-left"><span class="glw-status-dot"></span>Online</div>
    <div class="glw-status-right">REST Countries + Nominatim API</div>
  </div>

</div>

<script>
(function () {
  'use strict';

  var RU_MAP = {
    'россия':'russia','сша':'united states','великобритания':'united kingdom',
    'германия':'germany','франция':'france','италия':'italy','испания':'spain',
    'китай':'china','япония':'japan','бразилия':'brazil','канада':'canada',
    'австралия':'australia','индия':'india','мексика':'mexico','аргентина':'argentina',
    'южная корея':'south korea','нидерланды':'netherlands','польша':'poland',
    'украина':'ukraine','беларусь':'belarus','казахстан':'kazakhstan',
    'турция':'turkey','египет':'egypt','израиль':'israel','швеция':'sweden',
    'норвегия':'norway','финляндия':'finland','дания':'denmark',
    'португалия':'portugal','австрия':'austria','швейцария':'switzerland',
    'бельгия':'belgium','чехия':'czechia','румыния':'romania','венгрия':'hungary',
    'греция':'greece','таиланд':'thailand','индонезия':'indonesia',
    'вьетнам':'vietnam','малайзия':'malaysia','пакистан':'pakistan',
    'иран':'iran','ирак':'iraq','саудовская аравия':'saudi arabia',
    'южная африка':'south africa','нигерия':'nigeria','марокко':'morocco',
    'алжир':'algeria','узбекистан':'uzbekistan','азербайджан':'azerbaijan',
    'грузия':'georgia','армения':'armenia','сербия':'serbia','хорватия':'croatia',
    'болгария':'bulgaria','литва':'lithuania','латвия':'latvia','эстония':'estonia',
    'ирландия':'ireland','новая зеландия':'new zealand','сингапур':'singapore',
    'катар':'qatar','оаэ':'united arab emirates',
    'объединённые арабские эмираты':'united arab emirates',
    'объединенные арабские эмираты':'united arab emirates',
    'филиппины':'philippines','бангладеш':'bangladesh','куба':'cuba',
    'колумбия':'colombia','чили':'chile','перу':'peru','венесуэла':'venezuela',
    'тунис':'tunisia','судан':'sudan','эфиопия':'ethiopia','кения':'kenya',
    'танзания':'tanzania','ангола':'angola','гана':'ghana',
    'монголия':'mongolia','афганистан':'afghanistan','непал':'nepal',
    'мьянма':'myanmar','камбоджа':'cambodia','таджикистан':'tajikistan',
    'молдова':'moldova','исландия':'iceland','люксембург':'luxembourg',
    'словакия':'slovakia','словения':'slovenia','черногория':'montenegro',
    'северная македония':'north macedonia',
    'босния и герцеговина':'bosnia and herzegovina',
    'эквадор':'ecuador','боливия':'bolivia','парагвай':'paraguay',
    'уругвай':'uruguay','ямайка':'jamaica','панама':'panama','ливия':'libya',
    'сомали':'somalia','зимбабве':'zimbabwe','мозамбик':'mozambique',
    'замбия':'zambia','мадагаскар':'madagascar','камерун':'cameroon',
  };

  var HISTORY = [];

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function glwSet(v) {
    document.getElementById('glwInput').value = v;
    document.getElementById('glwInput').focus();
  }
  window.glwSet = glwSet;

  function showLoading() {
    document.getElementById('glwResult').innerHTML =
      '<div class="glw-loading">' +
        '<div class="glw-bar-wrap"><div class="glw-bar-inner"></div></div>' +
        '<span>Поиск данных...</span>' +
      '</div>';
  }

  function showResult(type, query, key, value) {
    var sysLabels = {
      city:    '// ТYPE: ГОРОД // СТАТУС: НАЙДЕНО',
      country: '// TYPE: СТРАНА // СТАТУС: НАЙДЕНО',
      err:     '// СТАТУС: НЕ НАЙДЕНО'
    };
    var keyLabel  = { city:'Страна', country:'Столица', err:'Ошибка' }[type];
    document.getElementById('glwResult').innerHTML =
      '<div class="glw-card ' + type + '">' +
        '<div class="glw-card-sys">' + sysLabels[type] + '</div>' +
        '<div class="glw-query-name">' + esc(query) + '</div>' +
        (value
          ? '<div class="glw-answer-row">' +
              '<span class="glw-answer-key">' + esc(keyLabel) + ' :</span>' +
              '<span class="glw-answer-val">' + esc(value) + '</span>' +
            '</div>'
          : '') +
      '</div>';
  }

  function addHistory(query, answer) {
    HISTORY.unshift({ q: query, a: answer });
    if (HISTORY.length > 5) HISTORY.pop();
    renderHistory();
  }

  function renderHistory() {
    var el = document.getElementById('glwHistory');
    if (!HISTORY.length) { el.innerHTML = ''; return; }
    var rows = HISTORY.map(function(h, i) {
      return '<div class="glw-hist-row" style="animation-delay:' + (i*0.04) + 's" onclick="glwSet(\'' + esc(h.q) + '\')">' +
               '<span class="glw-hist-q">' + esc(h.q) + '</span>' +
               '<span class="glw-hist-a">' + esc(h.a) + '</span>' +
             '</div>';
    }).join('');
    el.innerHTML =
      '<div class="glw-history">' +
        '<div class="glw-hist-label">// История запросов</div>' +
        '<div class="glw-hist-rows">' + rows + '</div>' +
      '</div>';
  }

  async function fetchCountry(name) {
    var key = name.trim().toLowerCase();
    var enName = RU_MAP[key] || key;
    try {
      var res = await fetch('https://restcountries.com/v3.1/name/' +
        encodeURIComponent(enName) + '?fields=name,capital');
      if (!res.ok) return null;
      var data = await res.json();
      if (!Array.isArray(data) || !data.length) return null;
      var capital = data[0].capital && data[0].capital[0];
      return capital ? { capital: capital } : null;
    } catch(e) { return null; }
  }

  async function fetchCity(name) {
    try {
      var res = await fetch(
        'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(name) +
        '&format=json&addressdetails=1&limit=1&accept-language=ru',
        { headers: { 'User-Agent': 'ZakharGeoWidget/3.0' } }
      );
      if (!res.ok) return null;
      var data = await res.json();
      if (!data.length) return null;
      var country = (data[0].address || {}).country;
      return country ? { country: country } : null;
    } catch(e) { return null; }
  }

  async function glwSearch() {
    var input = document.getElementById('glwInput');
    var btn   = document.getElementById('glwBtn');
    var query = input.value.trim();

    if (!query) {
      showResult('err', 'Пустой запрос', null, 'Введите название города или страны');
      return;
    }

    btn.disabled = true;
    showLoading();

    try {
      var countryData = await fetchCountry(query);
      if (countryData) {
        showResult('country', query, 'Столица', countryData.capital);
        addHistory(query, countryData.capital);
        return;
      }

      var cityData = await fetchCity(query);
      if (cityData) {
        showResult('city', query, 'Страна', cityData.country);
        addHistory(query, cityData.country);
        return;
      }

      showResult('err', query, null, 'Проверьте правильность написания');
    } catch (e) {
      showResult('err', 'Ошибка', null, e.message || 'Нет соединения с сервером');
    } finally {
      btn.disabled = false;
    }
  }
  window.glwSearch = glwSearch;

  document.getElementById('glwInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') glwSearch();
  });
})();
</script>
</div>
